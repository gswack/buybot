---
# Frontend = Vite/React SPA served by Nginx, which also reverse-proxies /api
# to the FastAPI backend over the VNet.
container_name: "public-app"
image_name: "priceapp/public-app"
image_tag: "latest"
container_port: 3000
host_port: 3000
build_context: "{{ app_dir }}/frontend"

# API base URL baked into the Vite bundle. The frontend code already prefixes
# every call with "/api" (e.g. `${API_BASE_URL}/api/search/...`), so this must
# be the ORIGIN ROOT (empty) — NOT "/api", or you get a double /api/api 404.
# Empty => same-origin: browser hits /api/... on the public VM, Nginx proxies it.
vite_api_base_url: ""

# Where Nginx forwards /api. Point at a backend VM's private IP:8000.
# Uses the first host in the [backend] inventory group by default; override
# with --extra-vars "backend_url=http://10.0.0.133:8000".
backend_url: "http://{{ hostvars[groups['backend'][0]].ansible_host }}:8000"
