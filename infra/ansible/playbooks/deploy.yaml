---
# ─────────────────────────────────────────────────────────────────────────────
# 1. Pull the application code onto every app host.
# ─────────────────────────────────────────────────────────────────────────────
- name: Clone/update application repository on all app servers
  hosts: frontend:backend
  become: true
  tasks:
    - name: Clone or update application repository
      git:
        repo: "{{ app_repo }}"
        dest: "{{ app_dir }}"
        version: dev
        force: true
      become_user: azureuser

    - name: Ensure the shared docker network exists
      community.docker.docker_network:
        name: "{{ docker_network }}"
        state: present

# ─────────────────────────────────────────────────────────────────────────────
# 2. Backend: Postgres + FastAPI (app.main:app) on port 8000.
# ─────────────────────────────────────────────────────────────────────────────
- name: Deploy backend (Postgres + FastAPI)
  hosts: backend
  become: true
  tasks:
    - name: Run Postgres container
      docker_container:
        name: "{{ postgres_container_name }}"
        image: "{{ postgres_image }}"
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ docker_network }}"
        env:
          POSTGRES_DB: "{{ postgres_db }}"
          POSTGRES_USER: "{{ postgres_user }}"
          POSTGRES_PASSWORD: "{{ postgres_password }}"
        volumes:
          - "pgdata:/var/lib/postgresql/data"

    - name: Wait for Postgres to accept connections
      community.docker.docker_container_exec:
        container: "{{ postgres_container_name }}"
        command: pg_isready -U {{ postgres_user }}
      register: pg_ready
      retries: 15
      delay: 4
      until: pg_ready.rc == 0

    - name: Stop and remove existing backend container (if any)
      docker_container:
        name: "{{ container_name }}"
        state: absent
      ignore_errors: true

    - name: Build backend (FastAPI) image
      docker_image:
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
        source: build
        build:
          path: "{{ build_context }}"
        force_source: true

    - name: Run backend (FastAPI) container
      docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ docker_network }}"
        ports:
          - "{{ host_port }}:{{ container_port }}"
        env:
          # Supply secrets at runtime: --extra-vars "serpapi_key=... apify_api_token=..."
          SERPAPI_KEY: "{{ serpapi_key | default('') }}"
          APIFY_API_TOKEN: "{{ apify_api_token | default('') }}"
          DATABASE_URL: "{{ database_url }}"
          TOP_K: "{{ top_k | default(10) | string }}"
          # Allow the deployed frontend origin for any non-proxied/cross-origin calls.
          CORS_ALLOW_ORIGINS: "{{ cors_allow_origins | default('') }}"

# ─────────────────────────────────────────────────────────────────────────────
# 3. Frontend: build the Vite app with the API base URL baked in, run on 3000.
#    VITE_API_BASE_URL=/api means the browser calls the same origin it loaded
#    from (the public VM), where Nginx proxies /api to the backend over the VNet.
# ─────────────────────────────────────────────────────────────────────────────
- name: Deploy frontend (Vite static site)
  hosts: frontend
  become: true
  tasks:
    - name: Stop and remove existing frontend container (if any)
      docker_container:
        name: "{{ container_name }}"
        state: absent
      ignore_errors: true

    - name: Build frontend image (bakes in VITE_API_BASE_URL)
      docker_image:
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
        source: build
        build:
          path: "{{ build_context }}"
          args:
            VITE_API_BASE_URL: "{{ vite_api_base_url | default('') }}"
          # Never reuse cached layers for the frontend: the Vite bundle bakes in
          # VITE_API_BASE_URL at build time, and a cached `npm run build` layer
          # would keep serving the old API base. Force a clean rebuild.
          nocache: true
        force_source: true

    - name: Run frontend container
      docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ host_port }}:{{ container_port }}"
        env:
          # Nginx proxies /api to this backend over the VNet. Set to a backend
          # VM's private IP: --extra-vars "backend_url=http://10.0.0.133:8000"
          BACKEND_URL: "{{ backend_url }}"

# ─────────────────────────────────────────────────────────────────────────────
# 4. Mount Azure Files NFS share on the backend servers (shared storage).
# ─────────────────────────────────────────────────────────────────────────────
- name: Mount shared storage on backend servers
  hosts: backend
  become: true
  tasks:
    - name: Install nfs-common (needed for Azure Files NFS mounts)
      apt:
        name: nfs-common
        state: present

    - name: Create mount point
      file:
        path: "{{ shared_storage_mount }}"
        state: directory
        mode: '0755'

    - name: Mount Azure Files NFS share
      mount:
        path: "{{ shared_storage_mount }}"
        src: "{{ storage_account_name }}.file.core.windows.net:/{{ storage_account_name }}/{{ file_share_name }}"
        fstype: nfs
        opts: "vers=4,minorversion=1,sec=sys"
        state: mounted
      when: storage_account_name is defined and file_share_name is defined
